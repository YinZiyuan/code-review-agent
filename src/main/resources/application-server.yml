spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: review-operations
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_ACQUISITION_TIMEOUT_MS:2000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
      connection-init-sql: >-
        SET statement_timeout = '10s'; SET lock_timeout = '2s'; SET idle_in_transaction_session_timeout = '15s'
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_SECONDS:5}
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:15}
        cancelSignalTimeout: ${DB_CANCEL_TIMEOUT_SECONDS:2}
        tcpKeepAlive: true
  flyway:
    enabled: true
  transaction:
    default-timeout: 10s

langchain4j:
  open-ai:
    chat-model:
      api-key: ${MOONSHOT_API_KEY}

code-review:
  server:
    github:
      app-id: ${GITHUB_APP_ID}
      private-key: ${GITHUB_APP_PRIVATE_KEY}
      webhook-secret: ${GITHUB_WEBHOOK_SECRET}
      api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
      max-webhook-bytes: ${GITHUB_MAX_WEBHOOK_BYTES:1048576}
      connect-timeout: ${GITHUB_CONNECT_TIMEOUT:5s}
      read-timeout: ${GITHUB_READ_TIMEOUT:30s}
    worker:
      poll-interval: 1s
      batch-size: 10
      recovery-batch-size: 10
      lease-duration: 3m
      heartbeat-interval: 30s
      initial-backoff: 10s
      max-backoff: 5m
      jitter-ratio: 0.2
    maintenance:
      retention-age: ${REVIEW_OPERATIONS_RETENTION_AGE:30d}
      batch-size: ${REVIEW_OPERATIONS_RETENTION_BATCH_SIZE:500}
      interval: ${REVIEW_OPERATIONS_RETENTION_INTERVAL:1h}
    observability:
      refresh-interval: ${REVIEW_OBSERVABILITY_REFRESH_INTERVAL:15s}
      stale-threshold: ${REVIEW_OBSERVABILITY_STALE_THRESHOLD:15m}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-components: never
      show-details: never

logging:
  config: classpath:logback-server.xml
