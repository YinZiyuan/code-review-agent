langchain4j:
  open-ai:
    chat-model:
      base-url: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_BASE_URL:https://sub2api.apemind.ai/v1}
      api-key: ${APEMIND_API_KEY:${MOONSHOT_API_KEY:}}
      model-name: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_MODEL_NAME:gpt-5.6-sol}
      temperature: 0
      max-tokens: 4096
      timeout: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_TIMEOUT:180s}
      log-requests: false
      log-responses: false

code-review:
  rag:
    embedding-cache-dir: ${user.home}/.code-review-agent/cache
    top-k: 3
    min-score: 0.4
    rerank-enabled: true
    bm25-top-k: 8
    rerank-top-k: 4
    rrf-k: 60
  eval:
    judge-model: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_MODEL_NAME:gpt-5.6-sol}
    runs-per-sample: 1      # W1 keeps it 1; release uses 3
    samples-dir: eval/samples
    report-dir: eval/reports

spring:
  main:
    banner-mode: off

logging:
  level:
    root: INFO
    dev.langchain4j.example: INFO
