services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 128
    environment:
      POSTGRES_DB: code_review
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - review-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/code_review}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      LANGCHAIN4J_OPEN_AI_CHAT_MODEL_API_KEY: ${APEMIND_API_KEY:-${MOONSHOT_API_KEY:-}}
      LANGCHAIN4J_OPEN_AI_CHAT_MODEL_BASE_URL: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_BASE_URL:-https://sub2api.apemind.ai/v1}
      LANGCHAIN4J_OPEN_AI_CHAT_MODEL_MODEL_NAME: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_MODEL_NAME:-gpt-5.6-sol}
      LANGCHAIN4J_OPEN_AI_CHAT_MODEL_TIMEOUT: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_TIMEOUT:-180s}
      CODE_REVIEW_WORK_BUDGET_STAGES_REVIEW_MODEL: ${CODE_REVIEW_WORK_BUDGET_STAGES_REVIEW_MODEL:-180s}
      CODE_REVIEW_WORK_BUDGET_EXECUTION_REVIEWER_TIMEOUT: ${CODE_REVIEW_WORK_BUDGET_EXECUTION_REVIEWER_TIMEOUT:-240s}
      CODE_REVIEW_SERVER_WORKER_BATCH_SIZE: ${CODE_REVIEW_SERVER_WORKER_BATCH_SIZE:-1}
      DB_POOL_ACQUISITION_TIMEOUT_MS: ${DB_POOL_ACQUISITION_TIMEOUT_MS:-2000}
      DB_POOL_VALIDATION_TIMEOUT_MS: ${DB_POOL_VALIDATION_TIMEOUT_MS:-1000}
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256

volumes:
  review-data:
